name: fork_windows_release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    if: github.repository == 'sg004baa/wezterm'
    runs-on: windows-2025
    env:
      CARGO_INCREMENTAL: "0"
      # Cargo 1.100's per-crate paths can exceed Windows' command-line limit.
      # Shorten intermediates without changing target/release artifact paths.
      CARGO_BUILD_BUILD_DIR: 'D:\b'
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"

    steps:
      - name: "Validate release tag"
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v.+$') {
            throw "Release tag must match v*: $env:RELEASE_TAG"
          }
      - name: "Checkout release tag"
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          submodules: "recursive"
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
        with:
          target: "x86_64-pc-windows-msvc"
      - name: "Compile with sccache"
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: "Cache Rust Dependencies"
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: "cargo-deps-${{ hashFiles('**/Cargo.lock') }}"
      - name: "Vendor dependencies"
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: "Build release executables"
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --release -p wezterm -p wezterm-gui -p wezterm-mux-server
      - name: "Install cargo-nextest"
        uses: taiki-e/install-action@v2
        with:
          tool: "nextest"
      - name: "Test"
        id: test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:PATH = "C:\Strawberry\perl\bin;$env:PATH"
          $dir = Join-Path $env:RUNNER_TEMP ("windows-test-diagnostics-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $dir | Out-Null
          $started = [DateTime]::UtcNow
          $started.ToString("o") | Set-Content -Encoding utf8 (Join-Path $dir "started.txt")
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "started=$($started.ToString('o'))" >> $env:GITHUB_OUTPUT
          cargo nextest run --all --no-fail-fast 2>&1 | Tee-Object -FilePath (Join-Path $dir "nextest.log")
          $code = $LASTEXITCODE
          exit $code
      # Collect failure-only diagnostics; each source is best-effort so one failure does not hide the rest.
      - name: "Collect Windows test diagnostics"
        if: failure() && steps.test.outcome == 'failure'
        shell: pwsh
        timeout-minutes: 3
        continue-on-error: true
        env:
          DIAG_DIR: ${{ steps.test.outputs.dir }}
          TEST_STARTED: ${{ steps.test.outputs.started }}
        run: |
          $ErrorActionPreference = "Continue"
          $log = Join-Path $env:DIAG_DIR "nextest.log"
          $report = Join-Path $env:DIAG_DIR "diagnostics.txt"
          function Note($text) { $text | Add-Content -Encoding utf8 $report }
          function SafeVersion($label, $command, $commandArgs) {
            try { $value = & $command @commandArgs 2>&1; Note "$label`: $($value -join ' ')" }
            catch { Note "$label unavailable: $_" }
          }
          SafeVersion "rustc -Vv" "rustc" @("-Vv")
          SafeVersion "cargo --version" "cargo" @("--version")
          SafeVersion "cargo nextest --version" "cargo" @("nextest", "--version")
          try { Note "Windows: $((Get-CimInstance Win32_OperatingSystem).Caption) $([Environment]::OSVersion.Version)" } catch { Note "Windows version unavailable: $_" }
          Note "Diagnostic-step PATH (not the exact nextest child PATH), characters=$($env:PATH.Length): $env:PATH"
          $failed = @()
          try {
            $text = [IO.File]::ReadAllText($log) -replace "`e\[[\d;]*[A-Za-z]", ""
            $failed = [regex]::Matches($text, "command '([^']+\.exe)' --list") | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          } catch { Note "Could not parse nextest output: $_" }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          $llvm = Get-Command llvm-readobj.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin) {
            try {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
              if (Test-Path $vswhere) {
                $vs = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' 2>$null | Select-Object -First 1
                if ($vs) { $dumpbin = Get-Command $vs -ErrorAction Stop }
              }
            } catch { Note "vswhere lookup failed: $_" }
          }
          if (-not $dumpbin) {
            $llvmRoots = @("${env:ProgramFiles}\LLVM\bin\llvm-readobj.exe", "${env:ProgramFiles(x86)}\LLVM\bin\llvm-readobj.exe")
            foreach ($candidate in $llvmRoots) { if ((-not $llvm) -and (Test-Path $candidate)) { $llvm = Get-Command $candidate -ErrorAction SilentlyContinue } }
          }
          Note "Dependency tool: $(if ($dumpbin) { $dumpbin.Source } elseif ($llvm) { $llvm.Source } else { 'dumpbin and llvm-readobj unavailable' })"
          foreach ($path in $failed) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { Note "Missing failed executable: $path"; continue }
            try {
              $file = Get-Item -LiteralPath $path
              Note "Failed executable: $($file.FullName); bytes=$($file.Length); SHA256=$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)"
              if ($dumpbin) { Note "DEPENDENTS for $path`n$((& $dumpbin.Source /DEPENDENTS $path 2>&1) -join "`n")" }
              elseif ($llvm) { Note "Imports for $path`n$((& $llvm.Source --coff-imports $path 2>&1) -join "`n")" }
              else { Note "Dependency listing unavailable for $path" }
              Note "Direct inherited-environment probe (not the exact nextest environment): $path --list --format terse"
              $psi = [Diagnostics.ProcessStartInfo]::new()
              $psi.FileName = $path
              $psi.Arguments = "--list --format terse"
              $psi.UseShellExecute = $false
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $process = [Diagnostics.Process]::new()
              $process.StartInfo = $psi
              [void]$process.Start()
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              if (-not $process.WaitForExit(30000)) { $process.Kill(); [void]$process.WaitForExit(); Note "Probe timed out after 30 seconds"; continue }
              $out = $stdout.GetAwaiter().GetResult()
              $err = $stderr.GetAwaiter().GetResult()
              Note "Probe exit code: $($process.ExitCode) (hex 0x$('{0:X8}' -f $process.ExitCode))`nstdout:`n$out`nstderr:`n$err"
            } catch { Note "Executable diagnostics failed for $path`: $_" }
          }
          try {
            $events = Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = [DateTime]::Parse($env:TEST_STARTED).ToLocalTime(); Id = 1000,1001,33,59 } -MaxEvents 30 -ErrorAction Stop
            if (-not $events) { Note "No matching Application events since test start." }
            foreach ($event in $events) { Note "Application event: $($event.TimeCreated) ID=$($event.Id) Provider=$($event.ProviderName)`n$($event.FormatDescription())" }
          } catch { Note "Application event query unavailable or failed: $_" }
      - name: "Upload Windows test diagnostics"
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-diagnostics
          path: ${{ steps.test.outputs.dir }}
          if-no-files-found: warn
      - name: "Upload release executables"
        uses: actions/upload-artifact@v4
        with:
          name: "fork-windows-executables"
          if-no-files-found: error
          path: |
            target/release/wezterm.exe
            target/release/wezterm-gui.exe
            target/release/wezterm-mux-server.exe

  publish:
    if: github.repository == 'sg004baa/wezterm'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Download release executables"
        uses: actions/download-artifact@v4
        with:
          name: "fork-windows-executables"
          path: release-assets
      - name: "Create release if needed"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
      - name: "Upload release assets"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/wezterm.exe \
            release-assets/wezterm-gui.exe \
            release-assets/wezterm-mux-server.exe \
            --clobber
